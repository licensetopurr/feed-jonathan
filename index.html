<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Feed Jonathan" />
  <title>Feed Jonathan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Feed Jonathan</h1>
    <p class="sub">Eat the safe food. Figure out what he's allergic to.</p>
    <canvas id="game" width="800" height="300"></canvas>
    <p class="help desktop-only">Space / ↑ to jump (press again mid-air to double jump) &nbsp;·&nbsp; run into safe food to eat it &nbsp;·&nbsp; jump over allergens</p>
    <p class="help touch-only">Tap to jump · tap again in the air to double jump</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
